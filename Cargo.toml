[package]
name = "onelibrary-to-spotify-playlist"
version = "0.1.0"
edition = "2021"

[dependencies]
roxmltree = "0.20"
chrono = "0.4.42"
rspotify = { version = "0.15.3", features = ["env-file","cli"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.4"
dotenv = "0.15"
clap = { version = "4.5.53", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
